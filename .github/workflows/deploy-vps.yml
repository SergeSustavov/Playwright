name: Deploy to VPS and run tests

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: Choose which suite to run
        required: true
        default: ui:all
        type: choice
        options:
          - ui:desktop
          - ui:mobile
          - ui:all
          - api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy repository on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/playwright && cd /opt/playwright && if [ ! -d .git ]; then git clone ${{ github.server_url }}/${{ github.repository }} .; else git pull; fi"

      - name: Build Docker image
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/playwright && docker build -t playwright-tests ."

      - name: Run selected Playwright suite in container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/playwright && docker run --rm -e PLAYWRIGHT_SUITE=${{ inputs.test-suite }} playwright-tests"
