name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: test:ui:all
        type: choice
        options:
          - test:ui:desktop
          - test:ui:mobile
          - test:ui:all
          - test:api

      workers:
        description: Playwright workers
        required: true
        default: "2"

      retries:
        description: Playwright retries
        required: true
        default: "2"

env:
  IMAGE_NAME: playwright-tests
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: playwright-tests
  cancel-in-progress: true

jobs:
  tests:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Playwright
        run: |
          docker run --rm \
            -e CI=true \
            -e PLAYWRIGHT_WORKERS=${{ inputs.workers }} \
            -e PLAYWRIGHT_RETRIES=${{ inputs.retries }} \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            npm run ${{ inputs.suite }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore