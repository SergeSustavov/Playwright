name: Deploy to VPS and run tests

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: Choose which suite to run
        required: true
        default: ui:all
        type: choice
        options:
          - ui:desktop
          - ui:mobile
          - ui:all
          - api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy repository on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/playwright && cd /opt/playwright && if [ ! -d .git ]; then git clone ${{ github.server_url }}/${{ github.repository }} .; else git pull; fi"

      - name: Build Docker image
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/playwright && docker build -t playwright-tests ."

      - name: Run selected Playwright suite in container
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /opt/playwright && docker run --rm -e PLAYWRIGHT_SUITE=${{ inputs.test-suite }} playwright-tests"
