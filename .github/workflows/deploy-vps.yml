name: Run Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        required: true
        default: test:api
        options:
          - test:ui:desktop
          - test:ui:mobile
          - test:ui:all
          - test:api
          - test:ui:demo
          - test:api:demo
          - test:all:demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playwright
  cancel-in-progress: true

jobs:
  tests:
    runs-on:
      - self-hosted
      - linux
      - x64
      - vps
    timeout-minutes: 45
    env:
      IMAGE_NAME: playwright-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_NAME}:latest \
            .
      - name: Prepare report directories
        run: |
          rm -rf playwright-report test-results
          mkdir -p playwright-report test-results
      - name: Run Playwright
        run: |
          docker run --rm \
            -e CI=true \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            ${IMAGE_NAME}:latest \
            npm run ${{ inputs.suite }}
      # - name: Upload JUnit artifact
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: junit-results
      #     path: test-results
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  reports:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Job Summary
        run: |
          echo "# ✅ Playwright report published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY