name: Deploy to VPS and run tests

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: Choose which suite to run
        required: true
        default: ui:all
        type: choice
        options:
          - ui:desktop
          - ui:mobile
          - ui:all
          - api

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime image once
        run: |
          docker build --target runtime -t playwright-tests:${{ github.sha }} .

      - name: Save Docker image artifact
        run: |
          docker save -o playwright-tests-${{ github.sha }}.tar playwright-tests:${{ github.sha }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-image
          path: playwright-tests-${{ github.sha }}.tar

  ui-tests:
    needs: build-image
    if: ${{ startsWith(inputs.test-suite, 'ui') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: playwright-image

      - name: Load image
        run: |
          docker load -i playwright-tests-${{ github.sha }}.tar

      - name: Run selected UI suite in container
        run: |
          docker run --rm \
            -e CI=true \
            -e PLAYWRIGHT_SUITE=${{ inputs.test-suite }} \
            -e PLAYWRIGHT_RETRIES=3 \
            -e PLAYWRIGHT_WORKERS=2 \
            playwright-tests:${{ github.sha }}

  api-tests:
    needs: build-image
    if: ${{ inputs.test-suite == 'api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: playwright-image

      - name: Load image
        run: |
          docker load -i playwright-tests-${{ github.sha }}.tar

      - name: Run selected API suite in container
        run: |
          docker run --rm \
            -e CI=true \
            -e PLAYWRIGHT_SUITE=api \
            -e PLAYWRIGHT_RETRIES=3 \
            -e PLAYWRIGHT_WORKERS=2 \
            playwright-tests:${{ github.sha }}
