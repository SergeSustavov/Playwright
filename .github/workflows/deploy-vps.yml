name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        required: true
        default: test:ui:all
        options:
          - test:ui:desktop
          - test:ui:mobile
          - test:ui:all
          - test:api

      workers:
        description: Playwright workers
        required: true
        default: "2"

      retries:
        description: Playwright retries
        required: true
        default: "2"

concurrency:
  group: playwright
  cancel-in-progress: true

env:
  IMAGE_NAME: playwright-tests
  IMAGE_TAG: ${{ github.sha }}

jobs:
  tests:

    runs-on:
      - self-hosted
      - linux
      - x64
      - vps

    timeout-minutes: 45

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          docker --version
          nproc
          free -h
          df -h

      - name: Build Docker image
        run: |
          export DOCKER_BUILDKIT=1

          docker build \
            --target runtime \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Run Playwright
        run: |
          docker run --rm \
            -e CI=true \
            -e PLAYWRIGHT_WORKERS=${{ inputs.workers }} \
            -e PLAYWRIGHT_RETRIES=${{ inputs.retries }} \
            $IMAGE_NAME:$IMAGE_TAG \
            npm run ${{ inputs.suite }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Remove image
        if: always()
        run: |
          docker image rm -f $IMAGE_NAME:$IMAGE_TAG || true