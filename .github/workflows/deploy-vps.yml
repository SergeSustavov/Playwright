name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        required: true
        default: test:ui:all
        options:
          - test:ui:desktop
          - test:ui:mobile
          - test:ui:all
          - test:api

      workers:
        description: Playwright workers
        required: true
        default: "2"

      retries:
        description: Playwright retries
        required: true
        default: "2"

concurrency:
  group: playwright
  cancel-in-progress: true

jobs:
  tests:

    runs-on:
      - self-hosted
      - linux
      - x64
      - vps

    timeout-minutes: 45

    permissions:
      contents: read

    env:
      IMAGE_NAME: playwright-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          whoami
          docker --version
          docker ps
          nproc
          free -h
          df -h

      - name: Build image
        run: |
          docker build \
            -t ${IMAGE_NAME}:latest \
            .

      - name: Run Playwright
        run: |
          docker run --rm \
            -e CI=true \
            -e PLAYWRIGHT_WORKERS=${{ inputs.workers }} \
            -e PLAYWRIGHT_RETRIES=${{ inputs.retries }} \
            ${IMAGE_NAME}:latest \
            npm run ${{ inputs.suite }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore